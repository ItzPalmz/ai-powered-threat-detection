############################
# INPUT
# Optimized for high-volume UDP
############################
input {
  udp {
    port => 5514
    host => "0.0.0.0"
    # Increase OS receive buffer to prevent drops during spikes
    buffer_size => 26214400 
    # Workers should typically match CPU core count
    workers => 4            
    queue_size => 4000
    type => "syslog"
  }
}

############################
# FILTER
# Replaced Grok/Ruby with high-performance native plugins
############################
filter {

  # 1. Metadata / Ingest info
  mutate {
    add_field => {
      "ingest"        => "udp5514"
      "ingest_type"   => "syslog"
      "ingest_vendor" => "fortinet"
      "ingest_proto"  => "udp"
    }
  }

  # 2. Extract <PRI> and payload (Dissect is ~3x faster than Grok)
  dissect {
    mapping => { "message" => "<%{syslog_pri}>%{payload}" }
  }

  # 3. Native Syslog Priority Parser (Replaces your Ruby code)
  # This automatically creates syslog_facility and syslog_severity
  syslog_pri {
    syslog_pri_field_name => "syslog_pri"
  }

  # 4. Parse FortiGate key=value
  if [payload] {
    kv {
      source => "payload"
      field_split => " "
      value_split => "="
      trim_value => "\""
      remove_char_key => "\""
      # Prevents unnecessary CPU cycles on repeated keys
      allow_duplicate_values => false 
    }
  }

  # 5. Build @timestamp from FortiGate date+time
  if [date] and [time] {
    mutate {
      add_field => { "fg_timestamp" => "%{date} %{time}" }
    }
    date {
      match => [ "fg_timestamp", "yyyy-MM-dd HH:mm:ss" ]
      timezone => "Asia/Bangkok"
      target => "@timestamp"
    }
  }

  # 6. Type normalization
  mutate {
    convert => {
      "srcport"   => "integer"
      "dstport"   => "integer"
      "proto"     => "integer"
      "policyid"  => "integer"
      "sessionid" => "integer"
      "appid"     => "integer"
      "eventtime" => "integer"
    }
    # Remove large/temp fields to reduce Kafka payload size
    remove_field => ["payload", "fg_timestamp", "message"]
  }
}

############################
# OUTPUT
############################
output {
  kafka {
    bootstrap_servers => "192.168.19.80:9092"
    topic_id => "sys_logs"
    codec => json
    acks => "1"
    retries => 2147483647
    # Batching improves Kafka throughput significantly
    batch_size => 16384 
  }
}
