version: '3.8'

services:
  # Zookeeper for Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    restart: unless-stopped
    networks:
      - morpheus-network

  # Kafka message broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - morpheus-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Morpheus Pipeline - Production Instance 1
  morpheus-production-1:
    image: morpheus-rtx5090:latest
    container_name: morpheus-production-1
    depends_on:
      - kafka
    volumes:
      - ./scripts/morpheus:/workspace/scripts
      - ./models:/workspace/models
      - ./configs:/workspace/configs
      - morpheus-cache-1:/root/.cache
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MORPHEUS_LOG_LEVEL=INFO
    command: python /workspace/scripts/morpheus_pipeline.py
    restart: unless-stopped
    networks:
      - morpheus-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Morpheus Pipeline - Production Instance 2
  morpheus-production-2:
    image: morpheus-rtx5090:latest
    container_name: morpheus-production-2
    depends_on:
      - kafka
    volumes:
      - ./scripts/morpheus:/workspace/scripts
      - ./models:/workspace/models
      - ./configs:/workspace/configs
      - morpheus-cache-2:/root/.cache
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MORPHEUS_LOG_LEVEL=INFO
    command: python /workspace/scripts/morpheus_pipeline.py
    restart: unless-stopped
    networks:
      - morpheus-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Morpheus Pipeline - Production Instance 3
  morpheus-production-3:
    image: morpheus-rtx5090:latest
    container_name: morpheus-production-3
    depends_on:
      - kafka
    volumes:
      - ./scripts/morpheus:/workspace/scripts
      - ./models:/workspace/models
      - ./configs:/workspace/configs
      - morpheus-cache-3:/root/.cache
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MORPHEUS_LOG_LEVEL=INFO
    command: python /workspace/scripts/morpheus_pipeline.py
    restart: unless-stopped
    networks:
      - morpheus-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Morpheus Pipeline - Production Instance 4
  morpheus-production-4:
    image: morpheus-rtx5090:latest
    container_name: morpheus-production-4
    depends_on:
      - kafka
    volumes:
      - ./scripts/morpheus:/workspace/scripts
      - ./models:/workspace/models
      - ./configs:/workspace/configs
      - morpheus-cache-4:/root/.cache
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MORPHEUS_LOG_LEVEL=INFO
    command: python /workspace/scripts/morpheus_pipeline.py
    restart: unless-stopped
    networks:
      - morpheus-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # LLM Enrichment Service - Primary
  morpheus-llm-enrichment:
    image: morpheus-rtx5090:latest
    container_name: morpheus-llm-enrichment
    depends_on:
      - kafka
    volumes:
      - ./scripts/llm:/workspace/scripts
      - ./models:/workspace/models
      - ./configs:/workspace/configs
      - llm-cache:/root/.cache
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - LLM_MODEL_PATH=/workspace/models/mistral-7b-instruct-v0.2
      - COOLDOWN_SECONDS=600
      - MULTI_LOG_WINDOW=120
    command: python /workspace/scripts/llm_enrichment.py
    restart: unless-stopped
    networks:
      - morpheus-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # LLM Enrichment Service - Secondary
  morpheus-llm-enrichment-2:
    image: morpheus-rtx5090:latest
    container_name: morpheus-llm-enrichment-2
    depends_on:
      - kafka
    volumes:
      - ./scripts/llm:/workspace/scripts
      - ./models:/workspace/models
      - ./configs:/workspace/configs
      - llm-cache-2:/root/.cache
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - LLM_MODEL_PATH=/workspace/models/mistral-7b-instruct-v0.2
      - COOLDOWN_SECONDS=600
      - MULTI_LOG_WINDOW=120
    command: python /workspace/scripts/llm_enrichment.py
    restart: unless-stopped
    networks:
      - morpheus-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Wazuh Writer Service
  morpheus-writer:
    image: morpheus-rtx5090:latest
    container_name: morpheus-writer
    depends_on:
      - kafka
    volumes:
      - ./scripts/wazuh:/workspace/scripts
      - ./configs:/workspace/configs
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - WAZUH_INDEXER_HOST=${WAZUH_INDEXER_HOST:-localhost}
      - WAZUH_INDEXER_PORT=${WAZUH_INDEXER_PORT:-9200}
      - WAZUH_INDEXER_USER=${WAZUH_INDEXER_USER:-admin}
      - WAZUH_INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
    command: python /workspace/scripts/llm_to_wazuh.py
    restart: unless-stopped
    networks:
      - morpheus-network

volumes:
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local
  morpheus-cache-1:
    driver: local
  morpheus-cache-2:
    driver: local
  morpheus-cache-3:
    driver: local
  morpheus-cache-4:
    driver: local
  llm-cache:
    driver: local
  llm-cache-2:
    driver: local

networks:
  morpheus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16